<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chartpie.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E7A23B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chartpie — Private. Direct. Connected.</title>
  </head>
  <body style="margin: 0; background-color: #FFF9EF; color: #3B3530; font-family: system-ui, -apple-system, sans-serif;">

        });

    </script>

</html>
